<?xml version="1.0" encoding="UTF-8"?>
<!--
  The application icon: a monitor whose panel is lit from the bottom, which is the same
  reading the arrangement view draws inside each screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="panel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f5b341"/>
      <stop offset="62%" stop-color="#c98d2c"/>
      <stop offset="62%" stop-color="#3a3d44"/>
      <stop offset="100%" stop-color="#31343a"/>
    </linearGradient>
  </defs>

  <rect x="20" y="40" width="216" height="140" rx="16" fill="#22252b"/>
  <rect x="32" y="52" width="192" height="116" rx="8" fill="url(#panel)"/>
  <rect x="32" y="95" width="192" height="3" fill="#ffd894"/>

  <rect x="112" y="180" width="32" height="26" fill="#22252b"/>
  <rect x="76" y="206" width="104" height="16" rx="8" fill="#22252b"/>
</svg>
