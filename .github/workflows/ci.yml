name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failed build is more useful than a partly-built one when the log is all you get.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test on the minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than `stable`: the window needs 1.92 and the workspace says so, and a
      # job that always runs the newest compiler never actually checks that claim.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # `--locked` so a build here can never quietly resolve different dependency versions
      # from the ones committed in Cargo.lock.
      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Doc tests
        run: cargo test --workspace --doc --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: Build release binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # No apt step on purpose. Nothing in the workspace links a C library: the display-server
      # protocols are spoken by pure-Rust clients, and libwayland, libX11 and libGL are all
      # loaded at run time. Verified by building in a bare `ubuntu` container with nothing
      # installed but `build-essential`.
      - name: Build
        id: build
        run: ./scripts/build.sh

      # A new dynamic dependency means something started linking a C library, and the binary
      # would then need that package installed wherever it runs — which is exactly the
      # property this project is built around not having.
      - name: Check the binaries link nothing but the C runtime
        run: |
          for binary in target/${{ steps.build.outputs.target }}/release/monitorctl target/${{ steps.build.outputs.target }}/release/monitorctl-gui; do
            echo "== $binary"
            ldd "$binary"
            unexpected=$(ldd "$binary" | grep -oE '\blib[a-z0-9_+-]+\.so[.0-9]*' \
              | grep -vE '^(libc|libm|libgcc_s|libdl|libpthread|librt)\.so' | sort -u || true)
            if [ -n "$unexpected" ]; then
              echo "unexpected dynamic dependencies:"
              echo "$unexpected"
              exit 1
            fi
          done

      - name: Verify the package
        run: |
          cd dist
          sha256sum --check *.sha256
          tar -xzf "${{ steps.build.outputs.artifact_name }}.tar.gz"
          "${{ steps.build.outputs.artifact_name }}/monitorctl" --help

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          # Long enough to be useful for a bisect, short enough not to accumulate.
          retention-days: 30

  release:
    name: Attach the artifact to the release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
